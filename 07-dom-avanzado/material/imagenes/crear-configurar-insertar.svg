<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Crear, configurar e insertar un elemento</title>
<desc id="d">Tres pasos. Primero, createElement crea un elemento li vacío que todavía no está en la página y no tiene padre. Segundo, se configura con textContent, className y dataset. Tercero, se inserta con append en el menú, y desde ese momento aparece en la página y tiene padre.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tres pasos: crear → configurar → insertar</text>
<rect x="40" y="70" width="280" height="250" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="180" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">1. Crear</text>
<text x="56" y="140" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">document.createElement('li')</text>
<text x="180" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">un &lt;li&gt; vacío, fuera de la página</text>
<text x="180" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">padre: null · isConnected: false</text>
<path d="M 322 195 L 338 195" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<rect x="340" y="70" width="280" height="250" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="480" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">2. Configurar</text>
<text x="356" y="140" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">li.textContent = 'Té'</text>
<text x="356" y="164" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">li.className = 'producto'</text>
<text x="356" y="188" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">li.dataset.precio = 3.2</text>
<text x="480" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">ya tiene texto, clase y datos</text>
<text x="480" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">sigue fuera de la página</text>
<path d="M 622 195 L 638 195" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<rect x="640" y="70" width="280" height="250" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="780" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">3. Insertar</text>
<text x="656" y="140" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">menu.append(li)</text>
<text x="780" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">aparece al final del menú</text>
<text x="780" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">padre: &lt;ul&gt; · isConnected: true</text>
<rect x="40" y="342" width="880" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="480" y="365" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Página:  &lt;ul id="menu"&gt;  &lt;li&gt;Café&lt;/li&gt;  …  &lt;/ul&gt;</text>
<text x="480" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">solo el paso 3 cambia lo que ve la persona</text>
<rect x="40" y="410" width="880" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="437.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Configurar antes de insertar evita mostrar un elemento a medio armar.</text>
</svg>
