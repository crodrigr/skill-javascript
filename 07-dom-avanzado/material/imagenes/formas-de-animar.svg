<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Cuatro formas de animar un elemento</title>
<desc id="d">Cuatro formas de animar, de menos a más control manual. Uno: una clase con una transición de CSS, que avisa con transitionend. Dos: la propiedad style con una transición, que también avisa con transitionend. Tres: requestAnimationFrame, donde el código mueve el elemento en cada cuadro y se detiene al no pedir otro cuadro. Cuatro: Element.animate, que recibe cuadros clave y opciones y devuelve un Animation con la promesa finished.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="538" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">De la forma más simple a la que más control da</text>
<rect x="30" y="62" width="444" height="184" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="48" y="92" text-anchor="start" font-size="17" font-weight="700" fill="#1f2937">1. Clase + transición</text>
<text x="48" y="124" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">CSS: transition + estado final</text>
<text x="48" y="148" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">JS: classList.add(…)</text>
<text x="48" y="176" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">avisa: transitionend</text>
<text x="48" y="204" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">menos código · poco control</text>
<text x="322" y="230" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">control manual</text>
<rect x="330" y="216" width="22" height="8" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<rect x="360" y="216" width="22" height="8" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<rect x="390" y="216" width="22" height="8" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<rect x="420" y="216" width="22" height="8" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<rect x="486" y="62" width="444" height="184" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="504" y="92" text-anchor="start" font-size="17" font-weight="700" fill="#1f2937">2. style + transición</text>
<text x="504" y="124" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">JS: style.transition = …</text>
<text x="504" y="148" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">JS: style.opacity = 0.2</text>
<text x="504" y="176" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">avisa: transitionend</text>
<text x="504" y="204" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">valores calculados en JS</text>
<text x="778" y="230" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">control manual</text>
<rect x="786" y="216" width="22" height="8" rx="3" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<rect x="816" y="216" width="22" height="8" rx="3" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<rect x="846" y="216" width="22" height="8" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<rect x="876" y="216" width="22" height="8" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<rect x="30" y="258" width="444" height="184" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="48" y="288" text-anchor="start" font-size="17" font-weight="700" fill="#1f2937">3. requestAnimationFrame</text>
<text x="48" y="320" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">JS: función por cada cuadro</text>
<text x="48" y="344" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">JS: calcula con la marca de tiempo</text>
<text x="48" y="372" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">se detiene: no pedir otro cuadro</text>
<text x="48" y="400" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">máximo control · más trabajo</text>
<text x="322" y="426" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">control manual</text>
<rect x="330" y="412" width="22" height="8" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<rect x="360" y="412" width="22" height="8" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<rect x="390" y="412" width="22" height="8" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<rect x="420" y="412" width="22" height="8" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<rect x="486" y="258" width="444" height="184" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="504" y="288" text-anchor="start" font-size="17" font-weight="700" fill="#1f2937">4. Element.animate()</text>
<text x="504" y="320" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">JS: cuadros clave + opciones</text>
<text x="504" y="344" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">devuelve un Animation</text>
<text x="504" y="372" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">avisa: finished (promesa)</text>
<text x="504" y="400" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">sin CSS · pausa, finish, cancel</text>
<text x="778" y="426" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">control manual</text>
<rect x="786" y="412" width="22" height="8" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<rect x="816" y="412" width="22" height="8" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<rect x="846" y="412" width="22" height="8" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<rect x="876" y="412" width="22" height="8" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<rect x="40" y="458" width="880" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Lo más simple que alcance: transición con clase; después animate(); rAF solo si hace falta.</text>
<text x="480" y="502" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Siempre: animar transform y opacity, y respetar prefers-reduced-motion.</text>
</svg>
