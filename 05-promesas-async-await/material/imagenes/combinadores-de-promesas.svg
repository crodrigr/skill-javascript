<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Los cuatro combinadores de promesas</title>
<desc id="d">Un mismo caso con tres tareas: el precio se cumple a los 300 milisegundos, el stock falla a los 500 y el proveedor se cumple a los 700. Promise.all se rechaza a los 500 con Falló stock. Promise.race se cumple a los 300 con precio ok. Promise.allSettled se cumple a los 700 con el estado de las tres. Promise.any se cumple a los 300 con precio ok.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="558" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">El mismo caso, cuatro combinadores</text>
<text x="150" y="88" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">precio</text>
<rect x="170" y="66" width="234.0" height="32" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="287.0" y="86.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">✅ 300 ms</text>
<text x="150" y="130" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">stock</text>
<rect x="170" y="108" width="390.0" height="32" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="365.0" y="128.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">❌ 500 ms</text>
<text x="150" y="172" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">proveedor</text>
<rect x="170" y="150" width="546.0" height="32" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="443.0" y="170.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">✅ 700 ms</text>
<rect x="36" y="214" width="438" height="144" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="54" y="244" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#1f2937" xml:space="preserve">Promise.all</text>
<text x="54" y="276" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">se RECHAZA a los 500 ms</text>
<text x="54" y="302" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">motivo: Falló stock</text>
<text x="54" y="334" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Cuándo: necesitás todas</text>
<rect x="486" y="214" width="438" height="144" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="504" y="244" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#1f2937" xml:space="preserve">Promise.race</text>
<text x="504" y="276" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">se cumple a los 300 ms</text>
<text x="504" y="302" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">valor: precio ok (la primera)</text>
<text x="504" y="334" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Cuándo: la primera en terminar</text>
<rect x="36" y="374" width="438" height="144" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="54" y="404" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#1f2937" xml:space="preserve">Promise.allSettled</text>
<text x="54" y="436" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">se cumple a los 700 ms</text>
<text x="54" y="462" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">[ ✅ precio, ❌ stock, ✅ proveedor ]</text>
<text x="54" y="494" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Cuándo: un informe completo</text>
<rect x="486" y="374" width="438" height="144" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="504" y="404" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#1f2937" xml:space="preserve">Promise.any</text>
<text x="504" y="436" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">se cumple a los 300 ms</text>
<text x="504" y="462" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">valor: precio ok (la primera que se cumple)</text>
<text x="504" y="494" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Cuándo: la primera que funcione</text>
</svg>
