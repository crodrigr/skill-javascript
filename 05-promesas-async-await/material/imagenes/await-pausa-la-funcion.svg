<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">await pausa la función, no el hilo</title>
<desc id="d">Dos carriles. En el carril de la función atender, el mensaje 2 se escribe, la función se pausa en el await durante 500 milisegundos y se reanuda para escribir el mensaje 4. En el carril del resto del programa, durante esa pausa el hilo está libre y escribe el mensaje 3. La pausa es de la función, no del hilo.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La función se pausa; el programa sigue</text>
<text x="60" y="120" text-anchor="start" font-size="14" font-weight="700" fill="#2563eb">Función</text>
<text x="60" y="140" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">atender()</text>
<text x="60" y="250" text-anchor="start" font-size="14" font-weight="700" fill="#16a34a">Resto del</text>
<text x="60" y="270" text-anchor="start" font-size="14" font-weight="700" fill="#16a34a">programa</text>
<rect x="190" y="96" width="160" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="270.0" y="127.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">2. Empieza a atender</text>
<rect x="350" y="96" width="270" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="485" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">⏸ await esperar(500)</text>
<text x="485" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">la función está en pausa</text>
<rect x="620" y="96" width="190" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="715.0" y="127.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">4. Termina de atender</text>
<rect x="190" y="226" width="160" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="270.0" y="257.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">1. Antes de llamar</text>
<rect x="400" y="226" width="170" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="485.0" y="257.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">3. Después de llamar</text>
<text x="485" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">durante la pausa, el hilo está libre</text>
<line x1="350" y1="96" x2="350" y2="330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="620" y1="96" x2="620" y2="330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M 190 336 L 810 336" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="190" y="380" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">tiempo →</text>
<text x="350" y="356" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">0 ms</text>
<text x="620" y="356" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">500 ms</text>
<rect x="60" y="392" width="840" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">await pausa SOLO la función async que lo contiene.</text>
<text x="480" y="436" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">El código que sigue a la llamada se ejecuta mientras la función espera.</text>
</svg>
