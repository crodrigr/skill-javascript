<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Cadena de then con un solo catch</title>
<desc id="d">Cinco pasos en fila: validar, luego cobrar, preparar, entregar y terminar, cada uno con un then que devuelve una promesa para el paso siguiente. Debajo, un único catch al final recibe el motivo si cualquiera de los pasos se rechaza, y en ese caso los pasos siguientes no se ejecutan.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Cada .then() devuelve otra promesa: la cadena queda plana</text>
<rect x="36" y="80" width="160" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="116.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">validar(pedido)</text>
<path d="M 198 108 L 214 108" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 116 140 L 116 250" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="216" y="80" width="160" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="296.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">.then(cobrar)</text>
<path d="M 378 108 L 394 108" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 296 140 L 296 250" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="396" y="80" width="160" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="476.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">.then(preparar)</text>
<path d="M 558 108 L 574 108" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 476 140 L 476 250" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="576" y="80" width="160" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="656.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">.then(entregar)</text>
<path d="M 738 108 L 754 108" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 656 140 L 656 250" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="756" y="80" width="160" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="836.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">.then(terminar)</text>
<text x="480" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">si cualquier paso se rechaza…</text>
<line x1="116" y1="250" x2="836" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<path d="M 476 250 L 476 288" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/>
<rect x="300" y="292" width="360" height="60" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="480.0" y="317.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">.catch((motivo) =&gt; …)</text>
<text x="480.0" y="336.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">un solo lugar para el error</text>
<text x="480" y="384" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">y los pasos que siguen no se ejecutan</text>
<rect x="60" y="400" width="840" height="46" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="428.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Cada paso devuelve una promesa: el siguiente .then() espera a que se cumpla.</text>
</svg>
