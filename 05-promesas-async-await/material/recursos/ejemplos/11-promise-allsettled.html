<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Ejemplo 11 — Promise.allSettled: éxitos y fallos | Café Aroma</title>
  </head>
  <body>
    <h1>Ejemplo 11 — Promise.allSettled: éxitos y fallos</h1>
    <p>Abrí la consola (F12) para ver el resultado.</p>

    <script>
      function consultar(nombre, milisegundos, falla) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (falla) {
              reject('Falló ' + nombre);
              return;
            }
            resolve(nombre + ' ok');
          }, milisegundos);
        });
      }

      Promise.allSettled([
        consultar('precio', 300, false),
        consultar('stock', 500, true),
        consultar('proveedor', 700, false)
      ]).then((resultados) => {
        for (const r of resultados) {
          if (r.status === 'fulfilled') {
            console.log('✅ ' + r.value);
          } else {
            console.log('❌ ' + r.reason);
          }
        }
      });
    </script>
  </body>
</html>
