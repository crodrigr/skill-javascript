<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Ejemplo 16 — Atender errores con try, catch y finally | Café Aroma</title>
  </head>
  <body>
    <h1>Ejemplo 16 — Atender errores con try, catch y finally</h1>
    <p>Abrí la consola (F12) para ver el resultado.</p>

    <script>
      function cobrar(pedido) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (pedido.tarjetaValida === false) {
              reject('Tarjeta rechazada');
              return;
            }
            resolve(pedido);
          }, 500);
        });
      }

      async function intentar(pedido) {
        try {
          const p = await cobrar(pedido);
          console.log('💳 Cobrado $' + p.total);
        } catch (motivo) {
          console.log('❌ ' + motivo);
        } finally {
          console.log('🔚 Fin del intento del pedido ' + pedido.numero);
        }
      }

      intentar({ numero: 101, total: 6.7 });
      intentar({ numero: 102, total: 6.7, tarjetaValida: false });
    </script>
  </body>
</html>
