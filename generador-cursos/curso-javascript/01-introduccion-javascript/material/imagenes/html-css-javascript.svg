<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">HTML, CSS y JavaScript</title>
<desc id="d">Tres piezas de una página web. HTML es el contenido: el título Café Aroma y el párrafo con el total. CSS es el aspecto: color marrón para el título y verde en negrita para el total. JavaScript es el comportamiento: calcula 4.5 por 3 y escribe 13.5 en la página.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tres lenguajes, tres trabajos</text>
<rect x="30" y="60" width="280" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="170.0" y="83.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">HTML</text>
<text x="170.0" y="103.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">el contenido</text>
<rect x="30" y="128" width="280" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="42" y="156" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;h1&gt;Café Aroma&lt;/h1&gt;</text>
<text x="42" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;p&gt;Total: &lt;span id="total"&gt;</text>
<text x="42" y="208" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">?&lt;/span&gt;&lt;/p&gt;</text>
<rect x="335" y="60" width="280" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="475.0" y="83.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">CSS</text>
<text x="475.0" y="103.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">el aspecto</text>
<rect x="335" y="128" width="280" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="347" y="156" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">h1 { color: #92400e; }</text>
<text x="347" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">#total {</text>
<text x="347" y="208" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">  font-weight: bold;</text>
<text x="347" y="234" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">  color: #166534; }</text>
<rect x="640" y="60" width="280" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="780.0" y="83.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">JavaScript</text>
<text x="780.0" y="103.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">el comportamiento</text>
<rect x="640" y="128" width="280" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="652" y="156" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">const precio = 4.5;</text>
<text x="652" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">const cantidad = 3;</text>
<text x="652" y="208" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">const total = precio * cantidad;</text>
<text x="652" y="234" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">console.log('Total:', total);</text>
<rect x="150" y="320" width="660" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="480" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">Lo que ve la persona en el navegador</text>
<text x="480" y="384" text-anchor="middle" font-size="26" font-weight="700" fill="#92400e">Café Aroma</text>
<text x="480" y="414" text-anchor="middle" font-size="16" fill="#1f2937">Total de tu pedido: <tspan font-weight="700" fill="#166534">13.5</tspan></text>
<path d="M170 280 L330 316" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M475 280 L475 316" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M780 280 L630 316" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
</svg>
