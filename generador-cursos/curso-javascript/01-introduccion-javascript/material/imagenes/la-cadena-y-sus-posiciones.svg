<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Una cadena y sus posiciones</title>
<desc id="d">La cadena 'Aroma' como cinco cajas con las letras A, r, o, m, a y sus posiciones 0, 1, 2, 3 y 4. Su longitud es 5. La posición 0 es la A y la posición 4 es la última a. La posición 10 no existe y da undefined. Abajo se muestra cómo el operador más une cadenas y cómo '5' + 3 da '53'.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="438" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La cadena 'Aroma' es una sucesión de caracteres</text>
<rect x="290" y="90" width="72" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="326" y="138" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">A</text>
<text x="326" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">0</text>
<rect x="370" y="90" width="72" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="406" y="138" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">r</text>
<text x="406" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">1</text>
<rect x="450" y="90" width="72" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="486" y="138" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">o</text>
<text x="486" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">2</text>
<rect x="530" y="90" width="72" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="566" y="138" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">m</text>
<text x="566" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">3</text>
<rect x="610" y="90" width="72" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="646" y="138" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">a</text>
<text x="646" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">4</text>
<text x="250" y="132" text-anchor="end" font-size="15" font-weight="700" fill="#1f2937">'Aroma'</text>
<text x="250" y="190" text-anchor="end" font-size="13" font-weight="400" fill="#dc2626">posición</text>
<path d="M290 214 L290 224 L682 224 L682 214" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="486" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">length  →  5</text>
<text x="40" y="296" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">'Aroma'[0]</text>
<text x="200" y="296" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#16a34a" xml:space="preserve">→ 'A'</text>
<text x="40" y="322" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">'Aroma'[4]</text>
<text x="200" y="322" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#16a34a" xml:space="preserve">→ 'a'</text>
<text x="40" y="348" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">'Aroma'[10]</text>
<text x="200" y="348" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#dc2626" xml:space="preserve">→ undefined</text>
<text x="60" y="276" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">Acceder a un carácter</text>
<text x="520" y="276" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">Unir y convertir</text>
<text x="520" y="296" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">'Aroma' + ' ' + 'Café'</text>
<text x="716" y="296" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#16a34a" xml:space="preserve">→ 'Aroma Café'</text>
<text x="520" y="322" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">'5' + 3</text>
<text x="716" y="322" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#16a34a" xml:space="preserve">→ '53'   (concatena)</text>
<text x="520" y="348" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">'5' - 3</text>
<text x="716" y="348" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#16a34a" xml:space="preserve">→ 2      (convierte a número)</text>
<text x="520" y="374" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">1 + 2 + 'a'</text>
<text x="716" y="374" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#16a34a" xml:space="preserve">→ '3a'   (izquierda a derecha)</text>
<rect x="30" y="396" width="900" height="30" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Las posiciones empiezan en 0. Una cadena no se modifica carácter a carácter.</text>
</svg>
