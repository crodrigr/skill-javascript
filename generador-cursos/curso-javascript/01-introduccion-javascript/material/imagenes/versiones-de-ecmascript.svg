<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Las versiones de ECMAScript</title>
<desc id="d">Línea de tiempo de ECMAScript. ES5, en diciembre de 2009. Desde ES2015, en junio de 2015, hay una edición por año, cada junio. ES2015 aportó let, const y las plantillas de texto. ES2016 aportó el operador de potencia. ES2020 aportó el operador ?? y BigInt. ES2021 aportó los operadores lógicos de asignación.</desc>
