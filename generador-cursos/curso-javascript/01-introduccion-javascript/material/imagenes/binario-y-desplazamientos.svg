<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Binario y desplazamientos</title>
<desc id="d">El número 5 escrito en 8 bits es 00000101. Desplazarlo 2 bits a la izquierda con menor menor da 00010100, que es 20: cada desplazamiento duplica el valor. El número menos 8 en 8 bits es 11111000; desplazarlo 1 bit a la derecha con mayor mayor conserva el signo y da 11111100, que es menos 4. Con mayor mayor mayor se rellena con ceros por la izquierda y el resultado es siempre positivo. Los números reales usan 32 bits; aquí se muestran 8 para que quepan.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
