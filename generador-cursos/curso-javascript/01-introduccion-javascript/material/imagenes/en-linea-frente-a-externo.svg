<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">JavaScript en línea y en un archivo externo</title>
<desc id="d">Dos formas de incorporar JavaScript. En línea, el código va dentro de la página, entre las etiquetas script. Desde un archivo externo, la etiqueta script tiene un atributo src que apunta a un archivo con extensión js que solo contiene JavaScript. En los dos casos el navegador lee la página de arriba hacia abajo y ejecuta el script cuando lo encuentra: un script en el head se ejecuta antes de que exista el título.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">El navegador lee la página de arriba hacia abajo</text>
<rect x="30" y="56" width="430" height="40" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="245.0" y="81.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">EN LÍNEA</text>
<rect x="30" y="108" width="430" height="300" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="500" y="56" width="430" height="40" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="715.0" y="81.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">ARCHIVO EXTERNO</text>
<rect x="500" y="108" width="430" height="300" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="42" y="134" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;head&gt;</text>
<text x="42" y="158" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#b45309" xml:space="preserve">  &lt;script&gt;</text>
<text x="42" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">    console.log('1');   ← el título aún no existe</text>
<text x="42" y="206" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#b45309" xml:space="preserve">  &lt;/script&gt;</text>
<text x="42" y="230" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;/head&gt;</text>
<text x="42" y="254" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;body&gt;</text>
<text x="42" y="278" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">  &lt;h1 id="titulo"&gt;Café Aroma&lt;/h1&gt;</text>
<text x="42" y="302" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#b45309" xml:space="preserve">  &lt;script&gt;</text>
<text x="42" y="326" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">    console.log('2');   ← el título ya existe</text>
<text x="42" y="350" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#b45309" xml:space="preserve">  &lt;/script&gt;</text>
<text x="42" y="374" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;/body&gt;</text>
<text x="512" y="134" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;head&gt; … &lt;/head&gt;</text>
<text x="512" y="158" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;body&gt;</text>
<text x="512" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">  &lt;h1 id="titulo"&gt;Café Aroma&lt;/h1&gt;</text>
<text x="512" y="206" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#b45309" xml:space="preserve">  &lt;script src="js/tienda.js"&gt;&lt;/script&gt;</text>
<text x="512" y="230" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;/body&gt;</text>
<rect x="500" y="262" width="430" height="146" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="715" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">js/tienda.js (solo JavaScript)</text>
<text x="516" y="316" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">// sin etiquetas &lt;script&gt;</text>
<text x="516" y="342" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">const precio = 4.5;</text>
<text x="516" y="368" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">console.log(precio * 3);</text>
<path d="M715 214 L715 258" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/>
<path d="M18 134 L18 380" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="30" y="436" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Sirve para pruebas y código muy corto.</text>
<text x="500" y="436" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">Sirve para código que crece o se repite en varias páginas.</text>
<rect x="30" y="456" width="900" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Un error se informa con su archivo y su línea: pagina.html:17  o  tienda.js:8</text>
</svg>
