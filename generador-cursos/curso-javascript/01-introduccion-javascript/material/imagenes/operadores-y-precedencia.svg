<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Los operadores y su precedencia</title>
<desc id="d">Las familias de operadores ordenadas de mayor a menor precedencia: paréntesis, postfijos como n++, unarios como menos, no y typeof, potencia, multiplicación división y resto, suma y resta, desplazamientos, comparación de orden, igualdad, bits AND XOR y OR, lógicos AND y OR y el de coalescencia, y asignación. Abajo se resuelve 2 + 3 * 4 en dos pasos, que da 14.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Qué se resuelve primero</text>
<rect x="30" y="56" width="330" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="42" y="73" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">( )</text>
<text x="350" y="73" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">paréntesis</text>
<rect x="30" y="84" width="330" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="42" y="101" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">x++  x--</text>
<text x="350" y="101" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">postfijos</text>
<rect x="30" y="112" width="330" height="24" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="42" y="129" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">!  -x  ++x  typeof</text>
<text x="350" y="129" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">unarios</text>
<rect x="30" y="140" width="330" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="42" y="157" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">**</text>
<text x="350" y="157" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">potencia</text>
<rect x="30" y="168" width="330" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="42" y="185" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">*  /  %</text>
<text x="350" y="185" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">multiplicar, dividir, resto</text>
<rect x="30" y="196" width="330" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="42" y="213" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">+  -</text>
<text x="350" y="213" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">sumar y restar</text>
<rect x="30" y="224" width="330" height="24" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="42" y="241" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">&lt;&lt;  &gt;&gt;  &gt;&gt;&gt;</text>
<text x="350" y="241" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">desplazamientos</text>
<rect x="30" y="252" width="330" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="42" y="269" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">&lt;  &gt;  &lt;=  &gt;=</text>
<text x="350" y="269" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">orden</text>
<rect x="30" y="280" width="330" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="42" y="297" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">==  !=  ===  !==</text>
<text x="350" y="297" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">igualdad</text>
<rect x="30" y="308" width="330" height="24" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="42" y="325" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">&amp;   ^   |</text>
<text x="350" y="325" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">bits</text>
<rect x="30" y="336" width="330" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="42" y="353" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">&amp;&amp;</text>
<text x="350" y="353" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">Y lógico</text>
<rect x="30" y="364" width="330" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="42" y="381" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">||   ??</text>
<text x="350" y="381" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">O lógico y nulo</text>
<rect x="30" y="392" width="330" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="42" y="409" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#1f2937" xml:space="preserve">=  +=  &amp;&amp;=  ??= …</text>
<text x="350" y="409" text-anchor="end" font-size="11.5" font-weight="400" fill="#64748b">asignación</text>
<path d="M388 70 L388 400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="402" y="66" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">se resuelve primero</text>
<text x="402" y="398" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">se resuelve al final</text>
<rect x="540" y="60" width="390" height="210" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="735" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Un ejemplo paso a paso</text>
<text x="560" y="120" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#1f2937" xml:space="preserve">2 + 3 * 4</text>
<text x="560" y="154" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#2563eb" xml:space="preserve">2 + (3 * 4)      ← primero  *</text>
<text x="560" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#2563eb" xml:space="preserve">2 + 12           ← después  +</text>
<text x="560" y="214" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#16a34a" xml:space="preserve">14</text>
<text x="560" y="250" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" xml:space="preserve">(2 + 3) * 4  →  20   con paréntesis</text>
<rect x="540" y="290" width="390" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="735" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Casos especiales</text>
<text x="556" y="344" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">2 ** 3 ** 2  →  512   (derecha a izquierda)</text>
<text x="556" y="368" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#dc2626" xml:space="preserve">-2 ** 2  →  SyntaxError: usá paréntesis</text>
<text x="556" y="392" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#dc2626" xml:space="preserve">null ?? 0 || 5  →  SyntaxError</text>
<text x="480" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">Ante la duda, usá paréntesis: se lee mejor y evita errores.</text>
<text x="480" y="470" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">Mismo nivel de precedencia → se resuelven de izquierda a derecha (salvo ** y la asignación).</text>
</svg>
