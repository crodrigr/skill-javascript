  <body>
    <h1>Ejemplo 17 — Elevación (hoisting) de funciones</h1>
    <p>Abrí la consola (F12) para ver el resultado.</p>

    <script>
      console.log(saludar('Lucía'));

      function saludar(nombre) {
        return 'Hola, ' + nombre;
      }

      console.log(typeof saludar);
    </script>
