<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">break y continue en un bucle</title>
<desc id="d">Dos filas de seis vueltas, con n de 1 a 6. Con break cuando n vale 4, las vueltas 1, 2 y 3 se ejecutan completas, en la 4 el bucle termina y las vueltas 5 y 6 no se hacen. Con continue cuando n es par, las vueltas pares se saltan después del if y las impares se ejecutan completas.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">for (let n = 1; n &lt;= 6; n++)  →  seis vueltas posibles</text>
<rect x="30" y="60" width="900" height="40" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="480.0" y="84.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">break:  if (n === 4) { break; }</text>
<rect x="60" y="116" width="130" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="125" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 1</text>
<text x="125" y="174" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">console.log</text>
<text x="125" y="198" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">completa</text>
<rect x="208" y="116" width="130" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="273" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 2</text>
<text x="273" y="174" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">console.log</text>
<text x="273" y="198" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">completa</text>
<rect x="356" y="116" width="130" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="421" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 3</text>
<text x="421" y="174" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">console.log</text>
<text x="421" y="198" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">completa</text>
<rect x="504" y="116" width="130" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="569" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 4</text>
<text x="569" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">break</text>
<text x="569" y="198" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">termina el bucle</text>
<rect x="652" y="116" width="130" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="717" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">n = 5</text>
<text x="717" y="174" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">—</text>
<text x="717" y="198" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">no se hace</text>
<rect x="800" y="116" width="130" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="865" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">n = 6</text>
<text x="865" y="174" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">—</text>
<text x="865" y="198" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">no se hace</text>
<text x="480" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Se hacen 3 vueltas completas y el bucle termina en n = 4.</text>
<rect x="30" y="260" width="900" height="40" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="480.0" y="284.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">continue:  if (n % 2 === 0) { continue; }</text>
<rect x="60" y="316" width="130" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="125" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 1</text>
<text x="125" y="374" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">console.log</text>
<text x="125" y="398" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">completa</text>
<rect x="208" y="316" width="130" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="273" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 2</text>
<text x="273" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">continue</text>
<text x="273" y="398" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">se salta el resto</text>
<rect x="356" y="316" width="130" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="421" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 3</text>
<text x="421" y="374" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">console.log</text>
<text x="421" y="398" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">completa</text>
<rect x="504" y="316" width="130" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="569" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 4</text>
<text x="569" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">continue</text>
<text x="569" y="398" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">se salta el resto</text>
<rect x="652" y="316" width="130" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="717" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 5</text>
<text x="717" y="374" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">console.log</text>
<text x="717" y="398" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">completa</text>
<rect x="800" y="316" width="130" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="865" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">n = 6</text>
<text x="865" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">continue</text>
<text x="865" y="398" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">se salta el resto</text>
<text x="480" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Se saltan 3 vueltas (las pares) y el bucle sigue hasta n = 6.</text>
<text x="480" y="500" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">break: «dejo de repetir».   continue: «dejo esta vuelta y sigo con la próxima».</text>
</svg>
