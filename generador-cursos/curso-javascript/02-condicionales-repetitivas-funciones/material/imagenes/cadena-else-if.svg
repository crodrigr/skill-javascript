<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">La cadena if, else if, else</title>
<desc id="d">Una cadena de condiciones evaluadas en orden. Con total 35: la primera, total mayor o igual que 50, es falsa; la segunda, total mayor o igual que 20, es verdadera y asigna 5; el else final se salta. Solo se ejecuta la primera condición verdadera.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">else if: se ejecuta la primera condición verdadera (total = 35)</text>
<polygon points="250,75.0 400.0,120 250,165.0 100.0,120" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="250" y="116.55" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">if (total &gt;= 50)</text>
<text x="250" y="132.55" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" xml:space="preserve">falsa</text>
<rect x="540" y="90" width="330" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="705.0" y="115.55" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">porcentaje = 10;</text>
<text x="705.0" y="133.55" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">no se ejecuta</text>
<path d="M400 120 L536 120" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="470" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">sí</text>
<path d="M250 165 L250 205" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#ah)"/>
<text x="268" y="190" text-anchor="start" font-size="12" font-weight="700" fill="#ea580c">no</text>
<polygon points="250,210.0 400.0,255 250,300.0 100.0,255" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="250" y="251.55" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">else if (total &gt;= 20)</text>
<text x="250" y="267.55" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" xml:space="preserve">verdadera</text>
<rect x="540" y="225" width="330" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="705.0" y="250.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">porcentaje = 5;</text>
<text x="705.0" y="268.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">se ejecuta y se sale de la cadena</text>
<path d="M400 255 L536 255" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#ah)"/>
<text x="470" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">sí</text>
<path d="M250 300 L250 335" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/>
<rect x="100" y="335" width="300" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="250.0" y="358.55" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">else</text>
<text x="250.0" y="376.55" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">porcentaje = 0;</text>
<text x="540" y="360" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">no se ejecuta: ya hubo una condición verdadera</text>
<rect x="60" y="448" width="840" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Con total = 35 el descuento es 5%. El orden de las condiciones importa.</text>
</svg>
