<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anatomía del bucle for</title>
<desc id="d">La cabecera del for tiene tres partes: inicio let i igual a 1, que se ejecuta una vez; condición i menor o igual que 3, que se evalúa antes de cada vuelta; y avance i más más, que se ejecuta al final de cada vuelta. La traza muestra i igual a 1, 2 y 3 con la condición verdadera y el cuerpo ejecutado, e i igual a 4 con la condición falsa, donde el bucle termina.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="538" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">for (inicio; condición; avance) { cuerpo }</text>
<text x="480" y="82" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#1f2937" xml:space="preserve">for (let i = 1; i &lt;= 3; i++) {</text>
<rect x="155" y="108" width="200" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="255.0" y="131.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">① inicio</text>
<text x="255.0" y="149.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">let i = 1</text>
<rect x="380" y="108" width="200" height="56" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="480.0" y="131.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">② condición</text>
<text x="480.0" y="149.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">i &lt;= 3</text>
<rect x="615" y="108" width="200" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="715.0" y="131.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">④ avance</text>
<text x="715.0" y="149.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">i++</text>
<text x="255" y="184" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">una sola vez, al empezar</text>
<text x="480" y="184" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">antes de cada vuelta</text>
<text x="715" y="184" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">al final de cada vuelta</text>
<rect x="250" y="200" width="460" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="480" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">③ cuerpo: se ejecuta si la condición es verdadera</text>
<text x="480" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Traza: qué pasa en cada paso</text>
<rect x="60" y="290" width="840" height="32" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
<text x="120" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">i</text>
<text x="260" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">condición i &lt;= 3</text>
<text x="470" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">cuerpo</text>
<text x="600" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">avance</text>
<text x="740" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">sigue</text>
<rect x="60" y="330" width="840" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="120" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1</text>
<text x="270" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">1 &lt;= 3 → verdadera</text>
<text x="460" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">se ejecuta (vuelta 1)</text>
<text x="600" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">i++ → 2</text>
<text x="780" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">sí, vuelve a la condición</text>
<rect x="60" y="370" width="840" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="120" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2</text>
<text x="270" y="392" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">2 &lt;= 3 → verdadera</text>
<text x="460" y="392" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">se ejecuta (vuelta 2)</text>
<text x="600" y="392" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">i++ → 3</text>
<text x="780" y="392" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">sí, vuelve a la condición</text>
<rect x="60" y="410" width="840" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="120" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3</text>
<text x="270" y="432" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">3 &lt;= 3 → verdadera</text>
<text x="460" y="432" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">se ejecuta (vuelta 3)</text>
<text x="600" y="432" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">i++ → 4</text>
<text x="780" y="432" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">sí, vuelve a la condición</text>
<rect x="60" y="450" width="840" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="120" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4</text>
<text x="270" y="472" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">4 &lt;= 3 → falsa</text>
<text x="460" y="472" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">no se ejecuta</text>
<text x="600" y="472" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">—</text>
<text x="780" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">no: el bucle termina</text>
<text x="480" y="520" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">3 vueltas. Con let, la variable i solo existe dentro del for.</text>
</svg>
