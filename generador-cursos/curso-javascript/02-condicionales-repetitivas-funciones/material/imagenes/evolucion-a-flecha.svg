<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">De la función declarativa a la de flecha</title>
<desc id="d">Cuatro pasos para escribir la misma función. Primero la declarativa con function; luego la de expresión guardada en una constante; luego la flecha con llaves y return; y por último la flecha corta, sin llaves ni return. Con 4.5 y 3 las cuatro devuelven 13.5.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La misma función, cuatro formas (total(4.5, 3) = 13.5)</text>
<rect x="30" y="56" width="440" height="36" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="78.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1. Declarativa</text>
<rect x="30" y="100" width="440" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="44" y="130" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">function total(p, c) {</text>
<text x="44" y="156" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">  return p * c;</text>
<text x="44" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">}</text>
<rect x="490" y="56" width="440" height="36" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="710.0" y="78.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. De expresión</text>
<rect x="490" y="100" width="440" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="504" y="130" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">const total = function (p, c) {</text>
<text x="504" y="156" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">  return p * c;</text>
<text x="504" y="182" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">};</text>
<rect x="500" y="218" width="420" height="24" rx="12.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="710.0" y="234.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">cambio: se guarda en una constante</text>
<rect x="30" y="266" width="440" height="36" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="250.0" y="288.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3. Flecha con llaves</text>
<rect x="30" y="310" width="440" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="44" y="340" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">const total = (p, c) =&gt; {</text>
<text x="44" y="366" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">  return p * c;</text>
<text x="44" y="392" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">};</text>
<rect x="40" y="428" width="420" height="24" rx="12.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="250.0" y="444.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">cambio: desaparece la palabra function; aparece =&gt;</text>
<rect x="490" y="266" width="440" height="36" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="710.0" y="288.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. Flecha corta</text>
<rect x="490" y="310" width="440" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="504" y="340" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14.5" font-weight="400" fill="#1f2937" xml:space="preserve">const total = (p, c) =&gt; p * c;</text>
<rect x="500" y="428" width="420" height="24" rx="12.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="710.0" y="444.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">cambio: sin llaves ni return: el valor se devuelve solo</text>
<path d="M470 74 L492 74" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M470 284 L492 284" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="480" width="900" height="30" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Las cuatro devuelven lo mismo; cambia lo que hay que escribir y cuándo se puede llamar.</text>
</svg>
