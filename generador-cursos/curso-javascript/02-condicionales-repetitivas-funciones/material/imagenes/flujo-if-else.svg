<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Flujo de if y else</title>
<desc id="d">Diagrama de flujo de una decisión con if y else. Se evalúa la condición total mayor o igual que 20. Si es verdadera se muestra Envío gratis; si es falsa se muestra Envío con costo y cuánto falta. Con total 13.5 la condición es falsa y se recorre el camino del else. Después los dos caminos se juntan y el programa sigue.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">if / else: se recorre un solo camino</text>
<rect x="380" y="56" width="200" height="34" rx="17.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480.0" y="77.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">const total = 13.5;</text>
<path d="M480 90 L480 118" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="480,120.0 620.0,170 480,220.0 340.0,170" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="480" y="166.55" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">total &gt;= 20 ?</text>
<text x="480" y="182.55" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" xml:space="preserve">con total = 13.5</text>
<path d="M340 170 L190 170 L190 240" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/>
<path d="M620 170 L770 170 L770 240" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#ah)"/>
<text x="262" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">verdadera (if)</text>
<text x="698" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">falsa (else)</text>
<rect x="60" y="244" width="260" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="190.0" y="279.55" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">if { ... }</text>
<text x="190.0" y="297.55" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">console.log('Envío gratis')</text>
<rect x="640" y="244" width="260" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="770.0" y="270.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">else { ... }</text>
<text x="770.0" y="288.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">console.log('Envío con costo')</text>
<text x="770.0" y="306.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">faltan 6.5</text>
<path d="M190 324 L190 380 L460 380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M770 324 L770 380 L500 380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="380" y="366" width="200" height="34" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="480.0" y="387.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">sigue el programa</text>
<rect x="60" y="430" width="840" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Con total = 13.5: 13.5 &gt;= 20 es falso → se ejecuta el else.</text>
<text x="480" y="478" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Nunca se ejecutan los dos bloques: la condición elige uno.</text>
</svg>
