<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Elevación de funciones</title>
<desc id="d">Dos columnas. Con una función declarativa, el navegador la registra completa antes de ejecutar el código, así que llamarla en la primera línea funciona. Con una función de expresión guardada en una constante, la constante está en la zona muerta temporal hasta su línea, así que llamarla antes da un ReferenceError.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Antes de ejecutar, JavaScript lee todo el código</text>
<rect x="30" y="56" width="430" height="40" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="245.0" y="81.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">DECLARATIVA</text>
<rect x="30" y="108" width="430" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="44" y="136" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">saludar('Lucía');     // 1</text>
<text x="44" y="160" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve"></text>
<text x="44" y="184" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">function saludar(n) {</text>
<text x="44" y="208" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">  return 'Hola, ' + n;</text>
<text x="44" y="232" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">}</text>
<text x="245" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">① Al leer el código</text>
<rect x="30" y="288" width="430" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="245" y="319" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">Se registra completa al leer el código</text>
<text x="245" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">② Al ejecutar la línea 1</text>
<rect x="30" y="382" width="430" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="245" y="407" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Funciona: Hola, Lucía</text>
<path d="M245 340 L245 356" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="500" y="56" width="430" height="40" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="715.0" y="81.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">DE EXPRESIÓN (const)</text>
<rect x="500" y="108" width="430" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="514" y="136" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">despedir('Lucía');   // 1</text>
<text x="514" y="160" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve"></text>
<text x="514" y="184" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">const despedir = function (n) {</text>
<text x="514" y="208" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">  return 'Chau, ' + n;</text>
<text x="514" y="232" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2937" xml:space="preserve">};</text>
<text x="715" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">① Al leer el código</text>
<rect x="500" y="288" width="430" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="715" y="319" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">La constante existe pero no tiene valor</text>
<text x="715" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">② Al ejecutar la línea 1</text>
<rect x="500" y="382" width="430" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="715" y="403" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">ReferenceError:</text>
<text x="715" y="424" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937">Cannot access 'despedir' before initialization</text>
<path d="M715 340 L715 356" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="30" y="456" width="900" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="483" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Declarativa: se puede llamar antes.   De expresión: solo después de la línea que la define.</text>
</svg>
