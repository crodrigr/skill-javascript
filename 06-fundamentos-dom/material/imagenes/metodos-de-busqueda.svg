<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Qué devuelve cada método de búsqueda</title>
<desc id="d">Tabla con los cinco métodos de búsqueda. getElementById recibe un id y devuelve un elemento o null. getElementsByClassName y getElementsByTagName devuelven una HTMLCollection viva, vacía si no hay coincidencias. querySelector recibe un selector CSS y devuelve el primer elemento que coincide o null. querySelectorAll devuelve una NodeList estática, con forEach, vacía si no hay coincidencias.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Los cinco métodos de búsqueda</text>
<text x="40" y="74" text-anchor="start" font-size="14" font-weight="700" fill="#64748b">Método</text>
<text x="320" y="74" text-anchor="start" font-size="14" font-weight="700" fill="#64748b">Recibe</text>
<text x="500" y="74" text-anchor="start" font-size="14" font-weight="700" fill="#64748b">Devuelve</text>
<text x="800" y="74" text-anchor="start" font-size="14" font-weight="700" fill="#64748b">Si no hay nada</text>
<line x1="40" y1="84" x2="920" y2="84" stroke="#cbd5e1" stroke-width="2"/>
<rect x="30" y="96" width="900" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="127" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">getElementById(id)</text>
<text x="320" y="127" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">un id (sin #)</text>
<text x="500" y="127" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">un elemento</text>
<text x="800" y="127" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">null</text>
<rect x="30" y="160" width="900" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="40" y="191" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">getElementsByClassName(clase)</text>
<text x="320" y="191" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">una clase (sin .)</text>
<text x="500" y="191" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">HTMLCollection (viva)</text>
<text x="800" y="191" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">colección vacía</text>
<rect x="30" y="224" width="900" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="40" y="255" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">getElementsByTagName(etiqueta)</text>
<text x="320" y="255" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">una etiqueta</text>
<text x="500" y="255" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">HTMLCollection (viva)</text>
<text x="800" y="255" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">colección vacía</text>
<rect x="30" y="288" width="900" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="319" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">querySelector(selector)</text>
<text x="320" y="319" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">un selector CSS</text>
<text x="500" y="319" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">el primero que coincide</text>
<text x="800" y="319" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">null</text>
<rect x="30" y="352" width="900" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="40" y="383" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#1f2937" xml:space="preserve">querySelectorAll(selector)</text>
<text x="320" y="383" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">un selector CSS</text>
<text x="500" y="383" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">NodeList (estática)</text>
<text x="800" y="383" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">NodeList vacía</text>
<rect x="40" y="424" width="880" height="40" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="449.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Uno solo → un elemento o null. Varios → una colección (viva o estática).</text>
</svg>
