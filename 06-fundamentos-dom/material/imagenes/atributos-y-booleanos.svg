<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Atributos y atributos booleanos</title>
<desc id="d">Arriba, un enlace con tres atributos: id con valor carta, href con valor carta.html y target con valor _blank, con los métodos getAttribute, setAttribute y removeAttribute. Abajo, un botón con el atributo booleano disabled: con disabled igual a false sigue deshabilitado porque basta con que exista; se habilita quitando el atributo con removeAttribute o toggleAttribute.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Atributos: nombre y valor (siempre texto)</text>
<rect x="40" y="60" width="880" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="104" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#1f2937" xml:space="preserve">&lt;a  id="carta"  href="carta.html"  target="_blank"&gt;Ver la carta&lt;/a&gt;</text>
<rect x="58" y="124" width="100" height="32" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="108.0" y="144.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">id</text>
<rect x="190" y="124" width="100" height="32" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="240.0" y="144.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">href</text>
<rect x="380" y="124" width="100" height="32" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="430.0" y="144.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">target</text>
<text x="480" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">atributo = nombre + valor</text>
<rect x="40" y="196" width="212" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="146.0" y="222.85" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">getAttribute('href')</text>
<text x="146.0" y="238.85" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2937">→ "carta.html"  (o null)</text>
<rect x="264" y="196" width="212" height="62" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="370.0" y="222.85" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">setAttribute('href', 'menu.html')</text>
<text x="370.0" y="238.85" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2937">→ cambia el valor</text>
<rect x="488" y="196" width="212" height="62" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="594.0" y="222.85" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">removeAttribute('target')</text>
<text x="594.0" y="238.85" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2937">→ lo quita</text>
<rect x="712" y="196" width="212" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="818.0" y="222.85" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">getAttributeNames()</text>
<text x="818.0" y="238.85" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2937">→ ['id', 'href', 'target']</text>
<text x="480" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Atributos booleanos: basta con que existan</text>
<rect x="40" y="312" width="280" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="180" y="342" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">&lt;button disabled&gt;</text>
<text x="180" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">deshabilitado</text>
<rect x="340" y="312" width="280" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="480" y="342" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">&lt;button disabled="false"&gt;</text>
<text x="480" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">sigue deshabilitado</text>
<rect x="640" y="312" width="280" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="780" y="342" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">&lt;button&gt;</text>
<text x="780" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">habilitado</text>
<text x="480" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Para habilitarlo hay que QUITAR el atributo:</text>
<text x="480" y="432" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" xml:space="preserve">boton.removeAttribute('disabled')   o   boton.toggleAttribute('disabled')</text>
<rect x="40" y="456" width="880" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="483.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">setAttribute("disabled", "false") NO lo habilita: el atributo sigue existiendo.</text>
</svg>
