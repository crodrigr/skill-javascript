<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">La página como un árbol de nodos</title>
<desc id="d">A la izquierda, el HTML de una página con un título y una lista de tres productos. A la derecha, el mismo contenido como un árbol: la raíz document tiene el elemento html, que contiene head, con title, y body. El body contiene el h1 con id titulo y la lista ul con id menu, que contiene tres elementos li.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="498" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">El HTML se convierte en un árbol de nodos</text>
<rect x="30" y="62" width="330" height="330" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="195" y="86" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">HTML (el texto del archivo)</text>
<text x="44" y="112" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;html&gt;</text>
<text x="44" y="134" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">  &lt;head&gt;</text>
<text x="44" y="156" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">    &lt;title&gt;Aroma&lt;/title&gt;</text>
<text x="44" y="178" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">  &lt;/head&gt;</text>
<text x="44" y="200" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">  &lt;body&gt;</text>
<text x="44" y="222" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">    &lt;h1 id="titulo"&gt;Menú&lt;/h1&gt;</text>
<text x="44" y="244" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">    &lt;ul id="menu"&gt;</text>
<text x="44" y="266" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">      &lt;li&gt;Café&lt;/li&gt;</text>
<text x="44" y="288" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">      &lt;li&gt;Té&lt;/li&gt;</text>
<text x="44" y="310" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">      &lt;li&gt;Galleta&lt;/li&gt;</text>
<text x="44" y="332" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">    &lt;/ul&gt;</text>
<text x="44" y="354" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">  &lt;/body&gt;</text>
<text x="44" y="376" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">&lt;/html&gt;</text>
<path d="M 366 227 L 400 227" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<text x="383" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">el navegador</text>
<text x="383" y="258" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">lo convierte</text>
<rect x="440" y="56" width="150" height="34" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="515.0" y="77.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">document</text>
<rect x="440" y="112" width="150" height="34" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="515.0" y="133.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;html&gt;</text>
<rect x="430" y="176" width="110" height="34" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="485.0" y="197.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;head&gt;</text>
<rect x="560" y="176" width="110" height="34" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="615.0" y="197.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;body&gt;</text>
<rect x="430" y="240" width="100" height="34" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="480.0" y="261.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;title&gt;</text>
<rect x="545" y="240" width="125" height="34" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="607.5" y="261.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;h1 #titulo&gt;</text>
<rect x="690" y="240" width="120" height="34" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="750.0" y="261.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;ul #menu&gt;</text>
<rect x="620" y="312" width="90" height="34" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="665.0" y="333.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;li&gt; Café</text>
<rect x="720" y="312" width="90" height="34" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="765.0" y="333.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;li&gt; Té</text>
<rect x="820" y="312" width="100" height="34" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="870.0" y="333.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">&lt;li&gt; Galleta</text>
<line x1="515" y1="90" x2="515" y2="112" stroke="#64748b" stroke-width="2"/>
<line x1="515" y1="146" x2="485" y2="176" stroke="#64748b" stroke-width="2"/>
<line x1="515" y1="146" x2="615" y2="176" stroke="#64748b" stroke-width="2"/>
<line x1="485" y1="210" x2="480" y2="240" stroke="#64748b" stroke-width="2"/>
<line x1="615" y1="210" x2="607" y2="240" stroke="#64748b" stroke-width="2"/>
<line x1="615" y1="210" x2="750" y2="240" stroke="#64748b" stroke-width="2"/>
<line x1="750" y1="274" x2="665" y2="312" stroke="#64748b" stroke-width="2"/>
<line x1="750" y1="274" x2="765" y2="312" stroke="#64748b" stroke-width="2"/>
<line x1="750" y1="274" x2="870" y2="312" stroke="#64748b" stroke-width="2"/>
<text x="700" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">cada etiqueta es un nodo (un elemento)</text>
<rect x="40" y="410" width="880" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">document es la raíz: desde ahí se llega a cualquier elemento de la página.</text>
<text x="480" y="454" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">JavaScript cambia el árbol (el DOM); el archivo .html no cambia.</text>
</svg>
