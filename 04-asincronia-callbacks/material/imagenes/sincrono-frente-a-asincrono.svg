<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Síncrono frente a asíncrono</title>
<desc id="d">Dos líneas de tiempo. En la síncrona, el café de 1 segundo y después el té de 0,5 segundos se ejecutan uno tras otro y tardan 1,5 segundos en total. En la asíncrona, las dos esperas corren a la vez y tardan 1 segundo en total.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dos formas de esperar el café y el té</text>
<text x="60" y="100" text-anchor="start" font-size="17" font-weight="700" fill="#dc2626">Síncrono</text>
<text x="60" y="122" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">una espera a la otra</text>
<rect x="230" y="78" width="340.0" height="44" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="104.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">☕ Café (1 s)</text>
<rect x="570.0" y="78" width="170.0" height="44" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="655.0" y="104.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Té (0,5 s)</text>
<text x="760.0" y="106" text-anchor="start" font-size="15" font-weight="700" fill="#dc2626">total: 1,5 s</text>
<line x1="60" y1="160" x2="900" y2="160" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="215" text-anchor="start" font-size="17" font-weight="700" fill="#16a34a">Asíncrono</text>
<text x="60" y="237" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">esperas a la vez</text>
<rect x="230" y="190" width="340.0" height="40" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="214.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">☕ Café (1 s)</text>
<rect x="230" y="240" width="170.0" height="40" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="315.0" y="264.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Té (0,5 s)</text>
<text x="590.0" y="240" text-anchor="start" font-size="15" font-weight="700" fill="#16a34a">total: 1,0 s</text>
<line x1="230" y1="330" x2="910" y2="330" stroke="#64748b" stroke-width="2"/>
<line x1="230" y1="324" x2="230" y2="336" stroke="#64748b" stroke-width="2"/>
<text x="230" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">0 s</text>
<line x1="400.0" y1="324" x2="400.0" y2="336" stroke="#64748b" stroke-width="2"/>
<text x="400.0" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">0,5 s</text>
<line x1="570" y1="324" x2="570" y2="336" stroke="#64748b" stroke-width="2"/>
<text x="570" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">1 s</text>
<line x1="740.0" y1="324" x2="740.0" y2="336" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">1,5 s</text>
<line x1="910" y1="324" x2="910" y2="336" stroke="#64748b" stroke-width="2"/>
<text x="910" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">2 s</text>
<text x="60" y="336" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">tiempo →</text>
<rect x="60" y="385" width="840" height="58" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Síncrono: cada tarea espera a que termine la anterior.</text>
<text x="480" y="432" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Asíncrono: se inicia la tarea y el programa sigue; el resultado llega después.</text>
</svg>
