<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Orden de ejecución con setTimeout</title>
<desc id="d">A la izquierda, el código con cinco líneas: Primero, un setTimeout de 0 milisegundos que imprime Tercero, y Segundo. A la derecha, el orden real de salida: Primero, Segundo y Tercero, porque lo programado espera a que termine el código síncrono.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">setTimeout de 0 ms: se ejecuta después de lo síncrono</text>
<rect x="50" y="62" width="420" height="190" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="260" y="86" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Código (de arriba hacia abajo)</text>
<text x="70" y="118" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">console.log('Primero');</text>
<text x="70" y="146" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">setTimeout(() =&gt; {</text>
<text x="70" y="174" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">  console.log('Tercero');</text>
<text x="70" y="202" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">}, 0);</text>
<text x="70" y="230" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">console.log('Segundo');</text>
<text x="70" y="118" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#2563eb" xml:space="preserve">console.log('Primero');</text>
<text x="70" y="230" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#2563eb" xml:space="preserve">console.log('Segundo');</text>
<text x="70" y="146" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#d97706" xml:space="preserve">setTimeout(() =&gt; {</text>
<text x="70" y="174" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#d97706" xml:space="preserve">  console.log('Tercero');</text>
<text x="70" y="202" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#d97706" xml:space="preserve">}, 0);</text>
<text x="260" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">azul: se ejecuta ya · naranja: queda programado</text>
<text x="710" y="86" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Orden real de salida</text>
<rect x="510" y="104" width="400" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="536" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">1</text>
<text x="576" y="135" text-anchor="start" font-size="16" font-weight="700" fill="#1f2937">Primero</text>
<text x="900" y="135" text-anchor="end" font-size="12" font-weight="400" fill="#64748b">síncrono</text>
<rect x="510" y="166" width="400" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="536" y="197" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">2</text>
<text x="576" y="197" text-anchor="start" font-size="16" font-weight="700" fill="#1f2937">Segundo</text>
<text x="900" y="197" text-anchor="end" font-size="12" font-weight="400" fill="#64748b">síncrono</text>
<rect x="510" y="228" width="400" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="536" y="259" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">3</text>
<text x="576" y="259" text-anchor="start" font-size="16" font-weight="700" fill="#1f2937">Tercero</text>
<text x="900" y="259" text-anchor="end" font-size="12" font-weight="400" fill="#64748b">programado: espera su turno</text>
<path d="M 380 160 C 440 160 460 232 506 232" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="60" y="310" width="840" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Por qué</text>
<text x="480" y="364" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">0 ms significa «lo antes posible, pero después de que termine el código en marcha».</text>
<text x="480" y="388" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Primero se ejecuta todo lo síncrono; después, lo que estaba programado.</text>
<text x="480" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Un setTimeout, aunque sea de 0 ms, nunca se adelanta a una línea síncrona.</text>
</svg>
