<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Flujo de un callback</title>
<desc id="d">Dos columnas, tu código y el navegador. Tu código llama a setTimeout pasando la función avisar y 500 milisegundos. El navegador anota el pedido y devuelve el control. Tu código sigue con las demás líneas. A los 500 milisegundos el navegador llama a avisar. Pasar la función es entregarla, no ejecutarla.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Quién llama al callback y cuándo</text>
<rect x="110" y="62" width="260" height="40" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="240.0" y="87.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Tu código</text>
<rect x="590" y="62" width="260" height="40" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="720.0" y="87.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">El navegador</text>
<line x1="240" y1="108" x2="240" y2="430" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="720" y1="108" x2="720" y2="430" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 244 130 L 716 130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="480" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1. setTimeout(avisar, 500)</text>
<text x="480" y="150" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">entrega la función avisar, sin ejecutarla</text>
<path d="M 716 206 L 244 206" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="480" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. «anotado», seguí con tu código</text>
<text x="480" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">el control vuelve enseguida</text>
<rect x="180" y="262" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="287" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">3. tu código ejecuta las líneas siguientes</text>
<path d="M 716 358 L 244 358" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah)"/>
<text x="480" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. a los 500 ms: avisar()</text>
<text x="480" y="378" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">el navegador llama al callback</text>
<text x="232" y="326" text-anchor="end" font-size="12" font-weight="400" fill="#64748b">⏳ pasan 500 ms</text>
<rect x="60" y="440" width="840" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Pasar la función (avisar) es entregarla; llamarla (avisar()) es ejecutarla ya.</text>
<text x="480" y="488" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">El callback lo ejecuta quien lo recibió, cuando corresponde.</text>
</svg>
