<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Ejemplo 09 — De texto a objeto: JSON.parse() | Café Aroma</title>
  </head>
  <body>
    <h1>Ejemplo 09 — De texto a objeto: JSON.parse()</h1>
    <p>Abrí la consola (F12) para ver el resultado.</p>

    <script>
      const texto = '{"nombre":"Café","precio":4.5,"activo":true,"origen":null}';
      const producto = JSON.parse(texto);

      console.log(producto);
      console.log(producto.nombre, typeof producto.precio);

      console.log(JSON.parse('[1,2,3]'), JSON.parse('42'), JSON.parse('"hola"'), JSON.parse('true'));
    </script>
  </body>
</html>
