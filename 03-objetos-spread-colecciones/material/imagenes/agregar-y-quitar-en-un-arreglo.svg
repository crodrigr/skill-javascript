<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Agregar y quitar elementos de un arreglo</title>
<desc id="d">Un pedido empieza como Café y Té. push de Medialuna agrega al final y devuelve 3. unshift de Brownie agrega al principio y devuelve 4. pop quita el último y devuelve Medialuna. shift quita el primero y devuelve Brownie. Los cuatro modifican el arreglo original.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">pedido = ['Café', 'Té']  →  los cuatro métodos modifican el arreglo</text>
<rect x="30" y="64" width="250" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="155" y="104" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">push('Medialuna')</text>
<text x="155" y="130" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">agrega al final</text>
<path d="M284 109 L330 109" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="102" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">devuelve</text>
<text x="420" y="126" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#d97706" xml:space="preserve">3</text>
<path d="M500 109 L540 109" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="550" y="86" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="593" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Café</text>
<rect x="644" y="86" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="687" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Té</text>
<rect x="738" y="86" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="781" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Medialuna</text>
<rect x="30" y="170" width="250" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="155" y="210" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">unshift('Brownie')</text>
<text x="155" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">agrega al principio</text>
<path d="M284 215 L330 215" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">devuelve</text>
<text x="420" y="232" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#d97706" xml:space="preserve">4</text>
<path d="M500 215 L540 215" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="550" y="192" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="593" y="221" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Brownie</text>
<rect x="644" y="192" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="687" y="221" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Café</text>
<rect x="738" y="192" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="781" y="221" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Té</text>
<rect x="832" y="192" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="875" y="221" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Medialuna</text>
<rect x="30" y="276" width="250" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="155" y="316" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">pop()</text>
<text x="155" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">quita el último</text>
<path d="M284 321 L330 321" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="314" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">devuelve</text>
<text x="420" y="338" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#d97706" xml:space="preserve">'Medialuna'</text>
<path d="M500 321 L540 321" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="550" y="298" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="593" y="327" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Brownie</text>
<rect x="644" y="298" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="687" y="327" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Café</text>
<rect x="738" y="298" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="781" y="327" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Té</text>
<rect x="30" y="382" width="250" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="155" y="422" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">shift()</text>
<text x="155" y="448" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">quita el primero</text>
<path d="M284 427 L330 427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="420" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">devuelve</text>
<text x="420" y="444" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#d97706" xml:space="preserve">'Brownie'</text>
<path d="M500 427 L540 427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="550" y="404" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="593" y="433" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Café</text>
<rect x="644" y="404" width="86" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="687" y="433" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">Té</text>
<text x="480" y="500" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">push y unshift devuelven la nueva longitud; pop y shift devuelven el elemento quitado.</text>
</svg>
