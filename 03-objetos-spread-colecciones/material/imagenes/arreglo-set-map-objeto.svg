<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Arreglo, Set, Map y objeto</title>
<desc id="d">Cuatro colecciones comparadas. El arreglo es una lista ordenada que admite repetidos y se lee por posición. El objeto guarda pares con claves de texto y describe una cosa. El Set guarda valores únicos. El Map guarda pares clave-valor con claves de cualquier tipo y conoce su tamaño con size.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
