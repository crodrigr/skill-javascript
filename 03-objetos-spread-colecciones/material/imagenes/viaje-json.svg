<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">El viaje de ida y vuelta entre objeto y JSON</title>
<desc id="d">Un objeto de JavaScript se convierte en un texto JSON con JSON.stringify y el texto vuelve a ser un objeto con JSON.parse. El texto es {"nombre":"Café","precio":4.5,"origen":null}. En el viaje se pierden las funciones y las propiedades con undefined; NaN pasa a null y las fechas pasan a texto.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Objeto → texto JSON → objeto</text>
<rect x="30" y="60" width="260" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="160" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">objeto</text>
<text x="50" y="116" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">nombre: 'Café'</text>
<text x="50" y="144" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">precio: 4.5</text>
<text x="50" y="172" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">origen: null</text>
<rect x="350" y="80" width="260" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="480.0" y="130.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">texto JSON (un string)</text>
<text x="480.0" y="149.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937"></text>
<text x="480" y="150" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">{"nombre":"Café","precio":4.5,</text>
<text x="480" y="168" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2937" xml:space="preserve">"origen":null}</text>
<rect x="670" y="60" width="260" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="800" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">objeto nuevo</text>
<text x="690" y="116" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">nombre: 'Café'</text>
<text x="690" y="144" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">precio: 4.5</text>
<text x="690" y="172" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">origen: null</text>
<path d="M292 110 L346 110" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<text x="319" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">stringify</text>
<path d="M612 110 L666 110" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<text x="639" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">parse</text>
<text x="480" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Qué pasa con cada tipo de dato</text>
<rect x="60" y="268" width="840" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="80" y="289" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">texto, número, booleano, null</text>
<text x="880" y="289" text-anchor="end" font-size="13.5" font-weight="400" fill="#1f2937">sobrevive</text>
<rect x="60" y="306" width="840" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="80" y="327" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">arreglo y objeto anidado</text>
<text x="880" y="327" text-anchor="end" font-size="13.5" font-weight="400" fill="#1f2937">sobrevive</text>
<rect x="60" y="344" width="840" height="32" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="80" y="365" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">función (método)</text>
<text x="880" y="365" text-anchor="end" font-size="13.5" font-weight="400" fill="#1f2937">desaparece</text>
<rect x="60" y="382" width="840" height="32" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="80" y="403" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">undefined</text>
<text x="880" y="403" text-anchor="end" font-size="13.5" font-weight="400" fill="#1f2937">desaparece (en un arreglo, null)</text>
<rect x="60" y="420" width="840" height="32" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="80" y="441" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">NaN e infinito</text>
<text x="880" y="441" text-anchor="end" font-size="13.5" font-weight="400" fill="#1f2937">pasa a null</text>
<rect x="60" y="458" width="840" height="32" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="80" y="479" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">fecha (Date)</text>
<text x="880" y="479" text-anchor="end" font-size="13.5" font-weight="400" fill="#1f2937">pasa a texto</text>
<text x="480" y="506" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">JSON usa siempre comillas dobles y no admite funciones, comentarios ni comas finales.</text>
</svg>
