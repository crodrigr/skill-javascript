<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">sort y el comparador</title>
<desc id="d">El arreglo [10, 9, 1, 100] ordenado de tres maneras. Sin comparador, sort convierte los números en texto y el resultado es [1, 10, 100, 9]. Con el comparador a menos b, el orden ascendente es [1, 9, 10, 100]. Con b menos a, el orden descendente es [100, 10, 9, 1]. sort modifica el arreglo original.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">const numeros = [10, 9, 1, 100]</text>
<rect x="30" y="60" width="900" height="88" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="50" y="92" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2937" xml:space="preserve">numeros.sort()</text>
<text x="50" y="122" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">ordena como TEXTO: "10" va antes que "9"</text>
<rect x="560" y="80" width="78" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="599" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">1</text>
<rect x="650" y="80" width="78" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="689" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">10</text>
<rect x="740" y="80" width="78" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="779" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">100</text>
<rect x="830" y="80" width="78" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="869" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">9</text>
<rect x="30" y="160" width="900" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="50" y="192" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2937" xml:space="preserve">numeros.sort((a, b) =&gt; a - b)</text>
<text x="50" y="222" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">menor a mayor</text>
<rect x="560" y="180" width="78" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="599" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">1</text>
<rect x="650" y="180" width="78" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="689" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">9</text>
<rect x="740" y="180" width="78" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="779" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">10</text>
<rect x="830" y="180" width="78" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="869" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">100</text>
<rect x="30" y="260" width="900" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="292" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2937" xml:space="preserve">numeros.sort((a, b) =&gt; b - a)</text>
<text x="50" y="322" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">mayor a menor</text>
<rect x="560" y="280" width="78" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="599" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">100</text>
<rect x="650" y="280" width="78" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="689" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">10</text>
<rect x="740" y="280" width="78" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="779" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">9</text>
<rect x="830" y="280" width="78" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="869" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">1</text>
<rect x="30" y="366" width="900" height="138" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="480" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">El comparador recibe dos elementos (a, b) y devuelve un número</text>
<text x="60" y="424" text-anchor="start" font-size="15" font-weight="700" fill="#16a34a">negativo</text>
<text x="60" y="446" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">a va antes que b</text>
<text x="360" y="424" text-anchor="start" font-size="15" font-weight="700" fill="#dc2626">positivo</text>
<text x="360" y="446" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">b va antes que a</text>
<text x="660" y="424" text-anchor="start" font-size="15" font-weight="700" fill="#64748b">cero</text>
<text x="660" y="446" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">da igual</text>
<text x="480" y="484" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">sort() y reverse() modifican el arreglo original: copiá primero con [...arreglo] si no querés tocarlo.</text>
</svg>
