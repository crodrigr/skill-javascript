<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">El valor de this según cómo se llama</title>
<desc id="d">Cuatro formas de llamar a un método y el valor de this en cada una. Con producto.total(), this es producto y el resultado es 9. Con el método guardado en una variable y llamado como suelto(), this es el objeto global y el resultado es NaN. Con una función de flecha como método, this es el del lugar donde se escribió y no el objeto. En modo estricto, un método suelto tiene this undefined y da TypeError.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="554" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">this depende de cómo se llama, no de dónde se escribió</text>
<text x="160" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">la llamada</text>
<text x="430" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">this vale</text>
<text x="660" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">el resultado</text>
<rect x="40" y="90" width="880" height="98" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="56" y="122" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">producto.total()</text>
<text x="430" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">producto</text>
<text x="430" y="154" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">el objeto antes del punto</text>
<text x="640" y="144" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">9</text>
<rect x="40" y="200" width="880" height="98" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="56" y="232" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">const suelto = producto.total;</text>
<text x="56" y="254" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">suelto()</text>
<text x="430" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#ea580c">globalThis</text>
<text x="430" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">sin objeto: el objeto global</text>
<text x="640" y="254" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">NaN</text>
<rect x="40" y="310" width="880" height="98" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="56" y="342" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">producto.conFlecha()</text>
<text x="56" y="364" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" xml:space="preserve">(flecha como método)</text>
<text x="430" y="348" text-anchor="middle" font-size="17" font-weight="700" fill="#ea580c">globalThis</text>
<text x="430" y="374" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">el this del lugar donde se escribió</text>
<text x="640" y="364" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f2937" xml:space="preserve">typeof this.precio → 'undefined'</text>
<rect x="40" y="420" width="880" height="98" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="56" y="452" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">'use strict'; suelto()</text>
<text x="430" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">undefined</text>
<text x="430" y="484" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">sin objeto, en modo estricto</text>
<text x="640" y="474" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" font-weight="700" fill="#1f2937" xml:space="preserve">TypeError</text>
<text x="480" y="542" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Llamá el método siempre con el objeto: producto.total().</text>
</svg>
